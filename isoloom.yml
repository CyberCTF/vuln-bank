# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Vulnerable Bank (by Al-Amir Badmus, Commando-X) as an Isoloom spec: the Flask banking
# application, vendored unchanged in build/web/app/, built by its own Dockerfile (database host
# and dependency date baked in), and its PostgreSQL database.
# `isoloom generate`, then `isoloom up docker`.
version: 1
name: vuln-bank

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.17.0/24, internet: false}

machines:
  db:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    ports:
      postgres:
        port: 5432
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/db

  web:
    networks: {lab: 10}
    depends_on: [db]
    resources: {cpus: 1, memory_mb: 512}
    ports:
      web:
        port: 5000
        protocol: http
        publish: true
    app:
      build: build/web
checks:
  - name: the bank answers
    http: http://web:5000/
    wait: 180
  - name: the health endpoint reaches the database
    http: http://web:5000/healthz
  - name: the login page answers
    http: http://web:5000/login
  - name: the API documentation is served
    http: http://web:5000/api/docs/

message: |
  Vulnerable Bank answers at {{ machines.web.ports.web.url }} and its API
  documentation at /api/docs/. Register an account, then look for ways to reach other
  customers' money, data and the admin panel.
